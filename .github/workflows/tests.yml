name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  website-login:
    name: Website login regressions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist
          npm ci

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          npm run build

      - name: Test login and admin authorization
        run: composer test:login

      - name: Test rendered homepage and login page
        run: npm run test:login

      - name: Check TypeScript
        run: npm run types:check

      - name: Check login code style
        run: |
          vendor/bin/pint --test app/Http/Controllers/Auth/LoginController.php app/Http/Middleware/HandleInertiaRequests.php app/Http/Middleware/IsAdmin.php app/Providers/FortifyServiceProvider.php routes/web.php config/fortify.php tests/Feature/Auth/WebsiteLoginTest.php tests/Feature/WebsiteHomeTest.php tests/Feature/AdminAuthTest.php tests/Feature/DashboardTest.php
          npm run check -- resources/js/pages/Welcome.vue resources/js/pages/auth/Login.vue resources/js/app.ts resources/js/components/AppHeader.vue resources/js/components/AppSidebar.vue resources/js/pages/Dashboard.vue tests/Frontend/website-auth.test.mjs

  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
